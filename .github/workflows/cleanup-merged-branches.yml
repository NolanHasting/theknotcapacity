name: Remove merged branches
on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.repository == 'NolanHasting/theknotcapacity' && (github.event_name != 'pull_request' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Delete local branches already merged into main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's merged PR metadata correctly handles squash merges where
          # git merge-base --is-ancestor is insufficient.
          mapfile -t merged_branches < <(
            gh pr list --repo "$GITHUB_REPOSITORY" --state merged --limit 200 \
              --json headRefName,baseRefName,isCrossRepository \
              --jq '.[] | select(.baseRefName == "main" and .isCrossRepository == false) | .headRefName'
          )
          for branch in "${merged_branches[@]}"; do
            case "$branch" in
              feature/*|fix/*) ;;
              *) continue ;;
            esac
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting merged branch: $branch"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
            fi
          done

      - name: Remove abandoned SMS prototype branch after verifying its backup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          backup="backup/sms-prototype-2026-11-12"
          prototype="feature/sms-alerts-only"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$prototype" >/dev/null 2>&1; then
            backup_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$backup" --jq '.object.sha')"
            feature_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$prototype" --jq '.object.sha')"
            if [ -n "$backup_sha" ] && [ "$backup_sha" = "$feature_sha" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$prototype" >/dev/null
              echo "Removed abandoned SMS feature branch; backup preserved."
            else
              echo "::error::Prototype differs from backup; refusing to delete it."
              exit 1
            fi
          fi
