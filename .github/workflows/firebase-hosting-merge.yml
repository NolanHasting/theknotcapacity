name: Deploy Firebase website and live data backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install and test backend
        run: |
          npm ci --prefix functions
          npm test --prefix functions
          node --check functions/index.js
          node --check functions/history.js
          node --check functions/analytics.js
          node --check functions/recounts.js
          node --check public/app.js
          node --check public/history.js
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Configure Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_THEKNOTCAPACITY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT_THEKNOTCAPACITY repository secret"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Explain required Firebase runtime IAM permission
        shell: bash
        run: |
          DEPLOYER_EMAIL="$(node -p "JSON.parse(require('fs').readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8')).client_email")"
          if [ -z "$DEPLOYER_EMAIL" ] || [ "$DEPLOYER_EMAIL" = "undefined" ]; then
            echo "::error::Service-account JSON does not contain client_email."
            exit 1
          fi
          echo "GitHub deployer identity: $DEPLOYER_EMAIL"
          echo "Runtime identity: theknotcapacity@appspot.gserviceaccount.com"
          echo "For Cloud Functions deployment, the GitHub deployer needs iam.serviceAccounts.actAs on the runtime identity."
          {
            echo "### Firebase deploy identity"
            echo "Deployer: \`$DEPLOYER_EMAIL\`"
            echo "Runtime account: \`theknotcapacity@appspot.gserviceaccount.com\`"
            echo "If deployment fails with iam.serviceAccounts.actAs, grant **Service Account User** to the deployer on the runtime account in Google Cloud IAM, then rerun this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retire only the three legacy planner Cloud Functions
        shell: bash
        run: |
          set -euo pipefail
          # Explicit names avoid --force deleting unrelated Cloud Functions.
          firebase functions:list --project theknotcapacity --json > "$RUNNER_TEMP/functions-list.json"
          node - "$RUNNER_TEMP/functions-list.json" > "$RUNNER_TEMP/planner-functions.txt" <<'NODE'
          const fs=require('node:fs');
          const payload=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(payload.status==='error')throw Error('Unable to inspect deployed functions');
          const rows=Array.isArray(payload.result)?payload.result:
            Array.isArray(payload.result?.functions)?payload.result.functions:null;
          if(!rows)throw Error('Unexpected firebase functions:list format');
          const retired=new Set(['plannerApi','evaluatePlannerAlerts','refreshKnotEvents']);
          for(const row of rows){
            const id=String(row.id||row.name||'').split('/').pop();
            if(retired.has(id))process.stdout.write(id+'\n');
          }
          NODE
          while IFS= read -r function_name; do
            [ -n "$function_name" ] || continue
            echo "Removing retired planner function: $function_name"
            firebase functions:delete "$function_name" --project theknotcapacity --region us-east1 --force
          done < "$RUNNER_TEMP/planner-functions.txt"
      - name: Deploy Hosting and Cloud Functions
        run: firebase deploy --project theknotcapacity --only functions,hosting --non-interactive
