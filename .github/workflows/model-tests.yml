name: Test occupancy model and dashboard
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - name: Backend regression tests
        run: npm test --prefix functions
      - name: JavaScript syntax checks
        run: |
          node --check functions/index.js
          node --check functions/logic.js
          node --check functions/recounts.js
          node --check functions/history.js
          node --check functions/analytics.js
          node --check functions/seasonal.js
          node --check functions/health.js
          node --check tests/reliability.test.js
          node --check tests/seasonal.test.js
          node --check functions/recounts.js
          node --check public/app.js
          node --check public/history.js
